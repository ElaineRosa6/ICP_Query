version: '3.8'

services:
  ymicp:
    image: yiminger/ymicp:latest
    container_name: ymicp
    ports:
      - "16181:16181"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:16181"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
